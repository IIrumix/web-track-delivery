<div class="bg-white border border-[#E4E7EC] w-full h-full rounded-r-2xl flex p-4 overflow-hidden">
    <div class="w-full h-full min-h-0 flex flex-col mt-4"><!-- border border-[#E4E7EC] -->
        <div class="flex items-center justify-between mb-5">
            <h1 class="text-[#0F172A] text-xl font-semibold">ออเด้อร์อาหาร</h1>
            <button
                type="button"
                (click)="simulateOrders()"
                [disabled]="simulating() || deletingOrderId() !== null"
                class="rounded-md bg-[#5DD4A8] px-2 py-1 text-xs font-medium text-white hover:bg-[#45bd91] disabled:cursor-not-allowed disabled:opacity-60"
            >
                {{ simulating() ? 'กำลังสร้าง...' : 'Simulate order' }}
            </button>
        </div>
        <div class="relative mb-5">
            <svg class="absolute left-2 top-1/2 -translate-y-1/2 w-4 h-4 text-[#0F172A]/62"
                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                aria-hidden="true">
                <circle cx="11" cy="11" r="7" stroke-width="2" />
                <path stroke-width="2" stroke-linecap="round" d="m16 16 4 4" />
            </svg>
            <input type="text" placeholder="ค้นหาออเด้อร์หรือลูกค้า"
                class=" w-full font-normal text-sm bg-[#F8FAFC] pl-8 pr-2 py-1 border-2 rounded-md border-[#E4E7EC]" />
        </div>
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-[#0F172A]/62 text-xs font-semibold">รายการออเด้อร์</h1>
            <button type="button" class="text-[#0F172A]/70 text-2xl leading-none font-light">+</button>
        </div>

        @if (deleteError()) {
            <p role="alert" class="mb-3 text-sm text-red-700">{{ deleteError() }}</p>
        }
        @if (deleteNotice()) {
            <p role="status" class="mb-3 text-sm text-emerald-700">{{ deleteNotice() }}</p>
        }

        <div class="flex-1 min-h-0 overflow-y-auto space-y-3 pr-2">
            @for (order of orders(); track order.order_id) {
                <article class="flex items-start rounded-lg border border-[#E4E7EC] transition-colors hover:bg-[#F8FAFC]">
                <button
                    type="button"
                    (click)="selectOrder(order)"
                    class="block min-w-0 flex-1 cursor-pointer rounded-lg p-3 text-left focus-visible:outline-2 focus-visible:outline-[#3EB489]">
                    <span class="block text-sm font-medium text-[#0F172A]">Order #{{ order.order_id }}</span>
                    <span class="mt-1 block text-xs text-[#64748B]">
                            ลูกค้า: {{ order.name }}
                    </span>
                    <!-- <div class="text-[#0F172A]/70 text-sm mt-1">
                        จำนวน: {{ order.quantity }} กล่อง
                    </div>
                    <div class="text-[#0F172A]/70 text-sm mt-1">
                        สถานะ: {{ order.status }}
                    </div> -->
                </button>
                <button
                    type="button"
                    (click)="deleteOrder(order)"
                    [disabled]="deletingOrderId() !== null || simulating()"
                    [attr.aria-label]="'ลบออเดอร์ ' + order.order_id"
                    class="mt-2 mr-2 shrink-0 cursor-pointer rounded-md px-2 py-1.5 text-xs font-medium text-red-700 hover:bg-red-50 focus-visible:outline-2 focus-visible:outline-red-600 disabled:cursor-wait disabled:opacity-50">
                    {{ deletingOrderId() === order.order_id ? 'กำลังลบ…' : 'ลบ' }}
                </button>
                </article>
            } @empty {
                <div class="text-[#0F172A]/62 text-sm">ไม่พบข้อมูลออเดอร์</div>
            }
        </div>
    </div>
</div>
