<div class="flex-1 min-h-0">
    <div class="w-full bg-white border border-[#E4E7EC] rounded-xl p-5 shadow-sm">

        <div class="flex items-center gap-3 mb-4">
            <span class="w-2.5 h-2.5 rounded-full bg-[#FF7A1A]"></span>
            <!-- Dynamic Order Title -->
            <h3 class="font-bold text-gray-900 text-base">Order #{{ orderNumber }}</h3>
            <!-- Dynamic Customer Info -->
            <span class="text-gray-500 text-sm">ลูกค้า: {{ customerName }}</span>
        </div>

        <div class="bg-[#ECFDF5] rounded-xl p-4 mb-4">
            <p class="text-xs text-gray-500 mb-1">รายการอาหาร</p>
            <div class="flex justify-between items-center text-sm text-gray-800">
                <!-- Dynamic Food Item & Quantity -->
                <span>{{ foodItem }}</span>
                <span class="font-medium">{{ quantity }} กล่อง</span>
            </div>
        </div>

        <div class="space-y-2 text-sm px-1">
            <div class="flex justify-between text-gray-600">
                <span>รวมทั้งหมด</span>
                <span class="font-medium text-gray-900">{{ quantity }} กล่อง</span>
            </div>
            <div class="flex justify-between text-gray-600">
                <span>กำไร / กล่อง</span>
                <!-- Dynamic Profit -->
                <span class="font-medium text-[#3EB489]">+{{ profit }} ฿</span>
            </div>
        </div>
    </div>
</div>
